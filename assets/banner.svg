<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091022"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 50) scale(260 140)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(740 160) scale(260 140)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="200" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 42px; font-weight: 800; letter-spacing: 1px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: #CBD5E1; }
      .pill { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; font-weight: 600; fill: #67E8F9; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="218" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="218" rx="16" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="898" height="218" rx="16" fill="url(#glowIndigo)"/>

  <!-- Top Pill -->
  <rect x="335" y="28" width="230" height="26" rx="13" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="352" cy="41" r="4" fill="#22D3EE"/>
  <text x="458" y="45" text-anchor="middle" class="pill">RAG • GROQ LLM • STREAMLIT</text>

  <!-- Title -->
  <text x="450" y="106" text-anchor="middle" class="title" fill="url(#titleGrad)" filter="url(#glow)">MinAIEngine</text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle" class="sub">Self-Learning Retrieval-Augmented Generation (RAG) AI Assistant</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(155, 162)">
    <rect width="175" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="87.5" y="19.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">Semantic Vector Search</text>
  </g>
  <g transform="translate(345, 162)">
    <rect width="195" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="97.5" y="19.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">Auto-Updating Knowledge</text>
  </g>
  <g transform="translate(555, 162)">
    <rect width="190" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="95" y="19.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">Dynamic Groq Model Pool</text>
  </g>
</svg>
